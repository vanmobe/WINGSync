name: CI

on:
  push:
    branches: [main, copilot/top-status-bar-orchestration]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Configure native build
        run: cmake --fresh -S native -B build/native -G "Visual Studio 17 2022" -A x64

      - name: Build native
        run: cmake --build build/native --config Release --parallel

      - name: Restore managed solution
        run: dotnet restore WingSync.slnx

      - name: Build managed solution
        run: dotnet build WingSync.slnx -c Release --no-restore

      - name: Capture user guide screenshots
        id: capture-guide-screenshots
        continue-on-error: true
        run: >-
          dotnet run --project tests/WingSync.UiTests -c Release --no-build --
          --app src/WingSync.App/bin/Release/net10.0-windows/WingSync.exe
          --artifacts artifacts/ui
          --capture-guide artifacts/user-guide

      - name: Upload user guide screenshots
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: user-guide-screenshots
          path: artifacts/user-guide
          if-no-files-found: ignore

      - name: Flag user guide screenshot capture failure
        if: steps.capture-guide-screenshots.outcome == 'failure'
        run: |
          echo "::warning::Capturing user guide screenshots failed; documentation images were not refreshed. This does not fail the build. See the 'Capture user guide screenshots' step log for details."

      - name: Run core tests
        run: dotnet run --project tests/WingSync.Core.Tests -c Release --no-build

      - name: Run integration tests
        run: dotnet run --project tests/WingSync.Integration.Tests -c Release --no-build

      - name: Run native helper self-test
        shell: pwsh
        run: |
          $candidates = @(
            "build/native/Release/WingSync.WapiHost.exe",
            "build/native/WapiHost/Release/WingSync.WapiHost.exe"
          )
          $helper = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $helper) { throw 'WingSync.WapiHost.exe was not found after native build.' }
          & $helper --self-test
          if ($LASTEXITCODE -ne 0) { throw "Native helper self-test failed with exit code $LASTEXITCODE." }
